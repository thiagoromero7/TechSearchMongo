<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - TechSearch</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="/static/css/dashboard_admin.css">
</head>
<body>

    <aside style="background-color: #1a1d24 !important; color: #ffffff; display: flex; flex-direction: column; justify-content: space-between; height: 100vh;">
        <div>
            <div style="padding: 20px; border-bottom: 1px solid #2d313f; display: flex; align-items: center; gap: 12px;">
                <div style="background-color: #4f46e5; color: white; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px;">
                    <i class="fa-solid fa-store"></i>
                </div>
                <span style="font-size: 1.2rem; font-weight: bold;">TechSearch Admin</span>
            </div>
            </div>
    </aside>

    <div id="product-modal">
        <form method="POST" action="/admin/salvar-produto">
            <div class="form-group-grid">
                <div>
                    <label for="name">Nome do Produto</label>
                    <input type="text" id="name" name="name" required placeholder="Nome do produto">
                </div>
                <div>
                    <label for="price">Preço (€)</label>
                    <input type="number" step="0.01" id="price" name="price" required placeholder="0,00">
                </div>
                <div>
                    <label for="stock">Stock Inicial</label>
                    <input type="number" id="stock" name="stock" required placeholder="Ex: 10">
                </div>
            </div>

            <div>
                <label for="description">Descrição do Produto</label>
                <textarea id="description" name="description" rows="3" placeholder="Escreva as características..."></textarea>
            </div>

            <div>
                <label for="image_url">URL da Imagem</label>
                <input type="url" id="image_url" name="image_url" placeholder="https://exemplo.com/imagem.jpg">
            </div>

            <div class="modal-footer">
                <button type="button" id="cancel-modal-btn">Cancelar</button>
                <button type="submit">Guardar Produto</button>
            </div>
        </form>
    </div>

    <script src="/static/js/home.js"></script>
    <script src="/static/js/dashboard_admin.js"></script>
</body>
</html>
