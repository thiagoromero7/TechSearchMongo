<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
  <title>Cadastro - TechSearch</title>
  <link rel="stylesheet" href="/static/css/cadastro.css">
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="container">
    <div class="logo">TechSearch</div>
    <form class="form" id="registerForm" method="POST" action="/cadastro">
      <h2>Cadastro</h2>
      <div class="alert-container" id="message-box"></div>
      <div class="input-group">
        <input type="text" id="name" name="username" placeholder="Nome" required>
      </div>
      <div class="input-group">
        <input type="email" id="email" name="email" placeholder="Email" required>
      </div>
      <div class="input-group">
        <input type="password" id="password" name="password" placeholder="Senha" required>
      </div>
      <div class="input-group">
        <input type="password" id="confirmPassword" name="password2" placeholder="Confirmar Senha" required>
      </div>
      <button type="submit">Cadastrar</button>
      <div class="redirect">
        <p>Já tem conta? <a href="/login.html">Entrar</a></p>
      </div>
    </form>
  </div>
  <footer class="auth-footer-bottom">
    <p>&copy; 2026 TechSearch. Todos os direitos reservados.</p>
  </footer>
  <script src="/static/js/cadastro.js"></script>
</body>
</html>
